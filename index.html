<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop Games</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f0f1a; overflow: hidden;
  background-image: radial-gradient(circle at 50% 50%, #1a1a3e 0%, #0f0f1a 80%);
}
.stars-bg {
  position: fixed; inset: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.8), transparent),
    radial-gradient(1px 1px at 22% 45%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 5% 70%, rgba(255,255,255,.9), transparent),
    radial-gradient(1px 1px at 35% 10%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 50% 30%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 65% 15%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 75% 55%, rgba(255,255,255,.8), transparent),
    radial-gradient(1px 1px at 88% 35%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 92% 75%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 40% 85%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 15% 55%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 60% 65%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 85% 88%, rgba(255,255,255,.8), transparent);
  animation: twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle { 0% { opacity: .7; } 100% { opacity: 1; } }
.container { position: relative; z-index: 1; text-align: center; padding: 20px; }
h1 {
  color: #fff; font-size: 3.5rem; font-weight: 900; margin-bottom: 8px;
  background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe, #f5af19, #00f5d4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
p { color: rgba(255,255,255,.35); margin-bottom: 35px; font-size: 1.05rem; letter-spacing: .5px; }
.games { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
.card {
  background: #1a1a2e; border-radius: 24px; padding: 28px 32px;
  text-decoration: none; color: #fff; border: 1px solid rgba(255,255,255,.08);
  transition: all .3s; width: 240px;
  box-shadow: 0 10px 40px rgba(0,0,0,.3);
}
.card:hover {
  transform: translateY(-8px); border-color: rgba(255,255,255,.15);
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.card-img {
  width: 140px; height: 140px; border-radius: 50%; object-fit: cover;
  margin-bottom: 16px; border: 3px solid;
  transition: transform .3s;
}
.card:hover .card-img { transform: scale(1.05); }
.card-dada .card-img { border-color: #f5576c; }
.card-bankkie .card-img { border-color: #f5af19; }
.card-meta .card-img { border-color: #00f5d4; }
.card h2 { font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; }
.card-dada h2 { color: #f5576c; }
.card-bankkie h2 { color: #f5af19; }
.card-meta h2 { color: #00f5d4; }
.card .desc { color: rgba(255,255,255,.3); font-size: .85rem; margin-bottom: 14px; }
.card .play-btn {
  display: inline-block; padding: 8px 28px; border-radius: 30px;
  font-weight: 700; font-size: .9rem; background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.7); transition: all .2s; border: 1px solid rgba(255,255,255,.1);
}
.card:hover .play-btn { background: rgba(255,255,255,.15); color: #fff; }
.card-dada .play-btn { border-color: rgba(245,87,108,.3); }
.card-dada:hover .play-btn { background: rgba(245,87,108,.2); border-color: #f5576c; }
.card-bankkie .play-btn { border-color: rgba(245,175,25,.3); }
.card-bankkie:hover .play-btn { background: rgba(245,175,25,.2); border-color: #f5af19; }
.card-meta .play-btn { border-color: rgba(0,245,212,.3); }
.card-meta:hover .play-btn { background: rgba(0,245,212,.2); border-color: #00f5d4; }
.footer { color: rgba(255,255,255,.1); margin-top: 35px; font-size: .8rem; letter-spacing: 2px; }
@media (max-width: 600px) {
  h1 { font-size: 2.4rem; }
  .card { width: 200px; padding: 20px; }
  .card-img { width: 110px; height: 110px; }
}
@media (max-width: 480px) {
  h1 { font-size: 1.8rem; }
  .games { gap: 15px; }
  .card { width: 160px; padding: 15px; }
  .card-img { width: 90px; height: 90px; }
  .card h2 { font-size: 1.2rem; }
  p { font-size: .9rem; margin-bottom: 25px; }
}
</style>
</head>
<body>
<div class="stars-bg"></div>
<div class="container">
  <h1>POP GAMES</h1>
  <p>choose a character and start popping</p>
  <div class="games">
    <a class="card card-dada" href="pop-dada/index.html">
      <img class="card-img" src="pop-dada/dada.jpeg" alt="Dada">
      <h2>POP-DADA</h2>
      <div class="desc">deep rumble shock</div>
      <div class="play-btn">▶ Play</div>
    </a>
    <a class="card card-bankkie" href="pop-bankkie/index.html">
      <img class="card-img" src="pop-bankkie/bankkie.png" alt="Bankkie">
      <h2>POP-BANKKIE</h2>
      <div class="desc">cat meow shock</div>
      <div class="play-btn">▶ Play</div>
    </a>
    <a class="card card-meta" href="pop-meta/index.html">
      <img class="card-img" src="pop-meta/meta.jpeg" alt="Meta">
      <h2>POP-META</h2>
      <div class="desc">cat meow shock</div>
      <div class="play-btn">▶ Play</div>
    </a>
  </div>
  <div class="footer">tap to pop 🐱</div>
</div>
</body>
</html>
