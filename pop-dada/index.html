<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pop-Dada</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ---- Galaxy Background ---- */
.bg {
  position: fixed; inset: 0; z-index: 0;
  overflow: hidden;
}
.bg-img {
  position: absolute; inset: -50px;
  background: url(dada.jpeg) center/cover no-repeat;
  filter: blur(40px) brightness(0.3) saturate(1.8);
  transform: scale(1.1);
}
.bg-overlay {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(180,60,200,.35) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(60,100,220,.3) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.4) 0%, transparent 70%),
    radial-gradient(ellipse at 20% 80%, rgba(200,80,150,.2) 0%, transparent 40%),
    radial-gradient(ellipse at 80% 20%, rgba(80,60,200,.25) 0%, transparent 40%);
}
.stars {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.8), transparent),
    radial-gradient(1px 1px at 22% 45%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 5% 70%, rgba(255,255,255,.9), transparent),
    radial-gradient(1px 1px at 35% 10%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 50% 30%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 65% 15%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 75% 55%, rgba(255,255,255,.8), transparent),
    radial-gradient(1px 1px at 88% 35%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 92% 75%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 40% 85%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 15% 55%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 60% 65%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 85% 88%, rgba(255,255,255,.8), transparent),
    radial-gradient(2px 2px at 30% 50%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 45% 25%, rgba(255,255,255,.7), transparent),
    radial-gradient(2px 2px at 55% 75%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 25% 90%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 95% 50%, rgba(255,255,255,.7), transparent);
  animation: twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle {
  0% { opacity: .7; }
  100% { opacity: 1; }
}

.floating-stars {
  position: absolute; inset: 0; pointer-events: none;
}
.floating-star {
  position: absolute; width: 3px; height: 3px;
  background: #fff; border-radius: 50%;
  box-shadow: 0 0 6px rgba(255,255,255,.6);
  animation: drift linear infinite;
}
@keyframes drift {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: .8; }
  90% { opacity: .6; }
  100% { transform: translateY(-120vh) translateX(30px); opacity: 0; }
}

.shooting-star {
  position: absolute; width: 120px; height: 1.5px;
  background: linear-gradient(to left, rgba(255,255,255,.8), transparent);
  border-radius: 1px;
  animation: shoot 6s ease-in infinite;
  opacity: 0;
}
.shooting-star:nth-child(1) { top: 15%; left: 80%; animation-delay: 2s; }
.shooting-star:nth-child(2) { top: 40%; left: 90%; animation-delay: 5s; }
.shooting-star:nth-child(3) { top: 70%; left: 85%; animation-delay: 8s; }
@keyframes shoot {
  0% { transform: translateX(0) translateY(0) rotate(-35deg); opacity: 0; }
  5% { opacity: 1; }
  15% { transform: translateX(-300px) translateY(200px) rotate(-35deg); opacity: 1; }
  16% { opacity: 0; }
  100% { opacity: 0; }
}

/* ---- Game UI ---- */
body {
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  font-family: 'Segoe UI', system-ui, sans-serif; user-select: none;
  overflow: hidden;
}
.container {
  position: relative; z-index: 1; text-align: center; padding: 20px;
}

.title {
  color: #fff; font-size: 2.8rem; font-weight: 900;
  letter-spacing: 2px; margin-bottom: 5px;
  background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 40px rgba(245,87,108,.3);
}
.subtitle { color: rgba(255,255,255,.4); font-size: .9rem; margin-bottom: 15px; letter-spacing: 4px; text-transform: uppercase; }

.counter {
  color: #fff; font-size: 1.3rem; margin-bottom: 15px;
  display: flex; justify-content: center; align-items: center; gap: 8px;
}
.counter-label { opacity: .6; }
.counter-num { color: #f5576c; font-weight: 900; font-size: 2.2rem; min-width: 60px; }

.pop-wrapper {
  position: relative; cursor: pointer; display: inline-block;
  border-radius: 50%; padding: 6px;
  background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
  box-shadow: 0 0 60px rgba(245,87,108,.3);
  transition: box-shadow .3s;
}
.pop-wrapper:hover { box-shadow: 0 0 80px rgba(245,87,108,.5); }
.pop-wrapper:active { transform: scale(0.96); transition: transform .05s; }

.pop-wrapper.popping {
  animation: squish .2s cubic-bezier(.68,-0.55,.27,1.55);
}
.pop-image {
  display: block; width: 280px; height: 280px; object-fit: cover;
  border-radius: 50%;
  transition: filter .1s;
}
.pop-wrapper.popping .pop-image {
  filter: brightness(1.3) saturate(1.4);
}
@keyframes squish {
  0% { transform: scale(1, 1); }
  30% { transform: scale(1.2, .85); }
  60% { transform: scale(.9, 1.15); }
  100% { transform: scale(1, 1); }
}

.particle-container {
  position: absolute; top: 50%; left: 50%; pointer-events: none;
}
.particle {
  position: absolute; width: 40px; height: 40px;
  border-radius: 50%; object-fit: cover;
  animation: floatUp .8s ease-out forwards;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--tx),var(--ty)) scale(.3); }
}

.controls { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.15);
  padding: 10px 24px; border-radius: 30px; font-size: .95rem; cursor: pointer;
  transition: all .2s; backdrop-filter: blur(10px); font-weight: 600;
}
.btn:hover { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.3); }
.btn-reset { color: #f5576c; border-color: rgba(245,87,108,.3); }
.btn-reset:hover { background: rgba(245,87,108,.15); }

.modal {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.85); justify-content: center; align-items: center;
  z-index: 100; backdrop-filter: blur(5px);
}
.modal.active { display: flex; }
.modal-content {
  background: #1a1a2e; padding: 30px; border-radius: 24px;
  min-width: 320px; max-height: 75vh; overflow-y: auto;
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.modal-content h2 { color: #fff; font-size: 1.6rem; margin-bottom: 15px; text-align: center; }
.modal-content ol {
  list-style-position: inside; color: rgba(255,255,255,.8);
  counter-reset: item;
}
.modal-content li {
  padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.06);
  font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center;
}
.modal-content li::before {
  counter-increment: item;
  content: counter(item);
  background: rgba(255,255,255,.1); border-radius: 50%;
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  font-size: .8rem; margin-right: 12px; flex-shrink: 0;
}
.modal-content .score-val { color: #f5576c; font-weight: 900; }
.empty-msg { text-align: center; color: rgba(255,255,255,.3); padding: 20px; }
.btn-close {
  background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; border: none;
  padding: 10px 30px; border-radius: 30px; margin-top: 20px; cursor: pointer;
  font-size: 1rem; font-weight: 600; display: block; width: 100%;
  transition: opacity .2s;
}
.btn-close:hover { opacity: .85; }

.hint {
  color: rgba(255,255,255,.2); font-size: .8rem; margin-top: 12px;
  letter-spacing: 1px;
}
.back-btn {
  display: inline-block; margin-top: 16px; padding: 8px 20px;
  border-radius: 30px; font-size: .85rem; font-weight: 600;
  color: rgba(255,255,255,.4); text-decoration: none;
  border: 1px solid rgba(255,255,255,.1);
  transition: all .2s;
}
.back-btn:hover { color: #fff; border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.05); }

/* ---- Milestone Shock Effect ---- */
.shock-flash {
  position: fixed; inset: 0; z-index: 199;
  background: #fff; pointer-events: none;
  opacity: 0;
}
.shock-flash.active {
  animation: flashBang .4s ease-out forwards;
}
@keyframes flashBang {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

.milestone-overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; justify-content: center; align-items: center;
  pointer-events: none; opacity: 0;
}
.milestone-overlay.active {
  pointer-events: auto; opacity: 1;
}

.milestone-img {
  position: fixed; object-fit: cover;
  animation: shockIn 1.2s ease-out forwards;
}

.milestone-img.center {
  width: 100vw; height: 100vh; top: 0; left: 0;
}
.milestone-img.corner {
  width: 120px; height: 120px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.3);
}

@keyframes shockIn {
  0% { transform: scale(1.5); opacity: 0; }
  15% { transform: scale(1); opacity: 1; }
  60% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}

.shock-text {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 201; font-size: 6rem; font-weight: 900; pointer-events: none;
  color: #fff; text-shadow: 0 0 40px rgba(245,87,108,.8), 0 0 80px rgba(245,87,108,.4);
  opacity: 0;
}
.shock-text.active {
  animation: shockText 1.5s ease-out forwards;
}
@keyframes shockText {
  0% { transform: translate(-50%,-50%) scale(4); opacity: 0; }
  10% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  70% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%,-50%) scale(1.5); opacity: 0; }
}

@keyframes screenShake {
  0%, 100% { transform: translate(0,0); }
  5% { transform: translate(-20px,-15px); }
  10% { transform: translate(15px,20px); }
  15% { transform: translate(-12px,8px); }
  20% { transform: translate(12px,-12px); }
  25% { transform: translate(-8px,15px); }
  30% { transform: translate(8px,-8px); }
  35% { transform: translate(-15px,-5px); }
  40% { transform: translate(5px,10px); }
  45% { transform: translate(-5px,-8px); }
  50% { transform: translate(0,0); }
}
.shaking { animation: screenShake 1.2s; }

.milestone-particles {
  position: fixed; inset: 0; z-index: 202; pointer-events: none;
  overflow: hidden;
}
.milestone-particle {
  position: absolute; border-radius: 50%; object-fit: cover;
  animation: milParticle 1.5s ease-out forwards;
}
@keyframes milParticle {
  0% { opacity: 1; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--tx),var(--ty)) scale(.15); }
}

@media (max-width: 500px) {
  .title { font-size: 2rem; }
  .pop-image { width: 220px; height: 220px; }
  .counter-num { font-size: 1.8rem; }
  .modal-content { min-width: auto; width: 90%; margin: 0 10px; }
}
</style>
</head>
<body>

<!-- Galaxy Background -->
<div class="bg">
  <div class="bg-img"></div>
  <div class="bg-overlay"></div>
  <div class="stars"></div>
  <div class="floating-stars" id="floatingStars"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
</div>

<!-- Game -->
<div class="container">
  <div class="title">POP-DADA</div>
  <div class="subtitle">tap to pop</div>

  <div class="counter">
    <span class="counter-label">POPS</span>
    <span class="counter-num" id="count">0</span>
  </div>

  <div class="pop-wrapper" id="popWrapper">
    <img class="pop-image" id="popImage" src="dada.jpeg" alt="Dada">
    <div class="particle-container" id="particles"></div>
  </div>

  <div class="controls">
    <button class="btn" id="leaderboardBtn">🏆 Leaderboard</button>
    <button class="btn btn-reset" id="resetBtn">↻ Reset</button>
  </div>

  <div class="hint">click or press Spacebar to pop</div>
  <a href="../index.html" class="back-btn">← Back to Home</a>
</div>

<!-- Milestone Shock -->
<div class="shock-flash" id="shockFlash"></div>
<div class="milestone-overlay" id="milestoneOverlay">
  <img class="milestone-img center" src="dada.jpeg" alt="">
</div>
<div class="shock-text" id="shockText"></div>
<div class="milestone-particles" id="milParticles"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2>🏆 Leaderboard</h2>
    <div id="leaderboardBody"></div>
    <button class="btn-close" id="closeBtn">Close</button>
  </div>
</div>

<script>
// Floating stars
const starContainer = document.getElementById('floatingStars');
for (let i = 0; i < 50; i++) {
  const star = document.createElement('div');
  star.className = 'floating-star';
  const size = 1 + Math.random() * 3;
  star.style.width = size + 'px';
  star.style.height = size + 'px';
  star.style.left = Math.random() * 100 + '%';
  star.style.bottom = '-10px';
  star.style.animationDuration = (8 + Math.random() * 12) + 's';
  star.style.animationDelay = (Math.random() * 10) + 's';
  if (Math.random() > .7) {
    star.style.boxShadow = `0 0 ${6 + Math.random() * 8}px rgba(200,150,255,.6)`;
  }
  starContainer.appendChild(star);
}

// Game
let count = parseInt(localStorage.getItem('popdada_count')) || 0;
const countEl = document.getElementById('count');
const popImage = document.getElementById('popImage');
const popWrapper = document.getElementById('popWrapper');
const particles = document.getElementById('particles');
const modal = document.getElementById('modal');
const leaderboardBody = document.getElementById('leaderboardBody');
const milestoneOverlay = document.getElementById('milestoneOverlay');
const shockText = document.getElementById('shockText');
const shockFlash = document.getElementById('shockFlash');
const milParticles = document.getElementById('milParticles');
const emojis = ['💥','✨','⭐','💫','🎉','🔥','❤️','💜','🌟','💯','🌈','⚡'];

countEl.textContent = count;

function playPop() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.08);
  } catch(e) {}
}

function spawnParticles() {
  for (let i = 0; i < 5; i++) {
    const el = document.createElement('img');
    el.className = 'particle';
    el.src = 'dada.jpeg';
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 120;
    el.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
    el.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
    particles.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }
}

function playMilestoneSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.5, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);

    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(800, ctx.currentTime);
    osc2.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
    gain2.gain.setValueAtTime(0.2, ctx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
    osc2.start(ctx.currentTime);
    osc2.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}

function triggerMilestone() {
  shockFlash.classList.add('active');
  document.body.classList.add('shaking');
  playMilestoneSound();

  shockText.textContent = `💥 ${count} POPS! 💥`;
  shockText.classList.add('active');
  milestoneOverlay.classList.add('active');

  // Corner photos
  const corners = [
    { top: '5%', left: '5%' },
    { top: '5%', right: '5%', left: 'auto' },
    { bottom: '5%', left: '5%', top: 'auto' },
    { bottom: '5%', right: '5%', left: 'auto', top: 'auto' },
  ];
  corners.forEach(pos => {
    const img = document.createElement('img');
    img.className = 'milestone-img corner';
    img.src = 'dada.jpeg';
    Object.assign(img.style, pos);
    milestoneOverlay.appendChild(img);
    setTimeout(() => img.remove(), 1500);
  });

  // Particles
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('img');
    el.className = 'milestone-particle';
    el.src = 'dada.jpeg';
    const size = 15 + Math.random() * 35;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = (25 + Math.random() * 50) + '%';
    el.style.top = (25 + Math.random() * 50) + '%';
    const angle = Math.random() * Math.PI * 2;
    const dist = 200 + Math.random() * 400;
    el.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
    el.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
    milParticles.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }

  setTimeout(() => {
    shockFlash.classList.remove('active');
    milestoneOverlay.classList.remove('active');
    shockText.classList.remove('active');
    document.body.classList.remove('shaking');
  }, 1800);
}

let canPop = true;

function pop() {
  if (!canPop) return;
  canPop = false;
  count++;
  countEl.textContent = count;
  localStorage.setItem('popdada_count', count);
  playPop();
  popWrapper.classList.add('popping');
  spawnParticles();
  if (count > 0 && count % 100 === 0) {
    triggerMilestone();
  }
  setTimeout(() => {
    popWrapper.classList.remove('popping');
    canPop = true;
  }, 120);
}

popWrapper.addEventListener('click', pop);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat) { e.preventDefault(); pop(); }
});

function renderLeaderboard() {
  const stored = JSON.parse(localStorage.getItem('popdada_leaderboard') || '[]');
  leaderboardBody.innerHTML = '';
  if (stored.length === 0) {
    leaderboardBody.innerHTML = '<div class="empty-msg">No scores yet!</div>';
    return;
  }
  const sorted = [...stored].sort((a,b) => b - a).slice(0, 10);
  const ol = document.createElement('ol');
  sorted.forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = `<span>POP</span><span class="score-val">${s}</span>`;
    ol.appendChild(li);
  });
  leaderboardBody.appendChild(ol);
}

document.getElementById('leaderboardBtn').addEventListener('click', () => {
  const stored = JSON.parse(localStorage.getItem('popdada_leaderboard') || '[]');
  if (count > 0) {
    if (!stored.includes(count)) {
      stored.push(count);
      localStorage.setItem('popdada_leaderboard', JSON.stringify(stored));
    }
  }
  renderLeaderboard();
  modal.classList.add('active');
});

document.getElementById('closeBtn').addEventListener('click', () => {
  modal.classList.remove('active');
});

modal.addEventListener('click', (e) => {
  if (e.target === modal) modal.classList.remove('active');
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Reset your POP count to 0?')) {
    count = 0;
    countEl.textContent = '0';
    localStorage.setItem('popdada_count', '0');
  }
});

window.addEventListener('load', () => {
  const stored = JSON.parse(localStorage.getItem('popdada_leaderboard') || '[]');
  if (count > 0 && !stored.includes(count)) {
    stored.push(count);
    localStorage.setItem('popdada_leaderboard', JSON.stringify(stored));
  }
});
</script>
</body>
</html>
